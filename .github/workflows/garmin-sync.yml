name: Garmin sync

on:
  schedule:
    # Times are UTC and cron does not follow daylight saving, so the window is
    # the union of both Polish offsets: 05:00-11:59 UTC is 07:00-13:59 in
    # summer (UTC+2) and 06:00-12:59 in winter (UTC+1), covering a 07:00-11:00
    # wake-up either way. Every 15 minutes, so the night shows up shortly after
    # the watch syncs; runs short-circuit without contacting Garmin once the
    # sleep score for the day is on file.
    - cron: "*/15 5-11 * * *"
    # One wider pass later on to catch a watch that synced late.
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many trailing days to refetch"
        required: false
        default: "7"

concurrency:
  group: garmin-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Choose the fetch window
        id: window
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "args=--days ${{ inputs.days }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 15 * * *" ]; then
            echo "args=--days 7" >> "$GITHUB_OUTPUT"
          else
            echo "args=--days 1 --skip-if-complete" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch sleep score and body battery
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
        run: python scripts/fetch_garmin.py ${{ steps.window.outputs.args }}

      - name: Commit updated data
        run: |
          if git diff --quiet -- docs/data.json; then
            echo "No new Garmin data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git commit -m "chore: update Garmin data"
          # A run queued behind an earlier one checked out the older main, so
          # rebase before pushing rather than failing on a non-fast-forward.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
